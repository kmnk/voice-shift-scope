name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 続けて push したときは、同じブランチの古い実行を止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 開発の機器（macOS）で回せる cargo test と frontend の npm test・typecheck は CI に置かない。
# CI は macOS で回せない Windows での build と test だけを持つ。
jobs:
  rust:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Tauri のアプリ（voice-tauri）は build のときに frontend/dist を取り込む
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - run: cargo build --workspace
      - run: cargo test --workspace
      - name: List audio devices
        run: cargo run -q -p voice-cli -- devices
      - name: Check acceptance criteria that already pass
        run: cargo run -q --release -p voice-cli -- check --criteria A1,A4,B1,B3
