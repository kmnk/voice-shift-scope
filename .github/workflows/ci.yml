name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# When pushed again in a row, cancel the older run on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# cargo test and the frontend npm test and typecheck, which run on the development machine (macOS), are not in CI.
# CI only has the Windows build and tests, which cannot run on macOS.
jobs:
  rust:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The Tauri app (voice-tauri) takes in frontend/dist at build time
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - run: cargo build --workspace
      - run: cargo test --workspace
      - name: List audio devices
        run: cargo run -q -p voice-cli -- devices
      - name: Check acceptance criteria that already pass
        run: cargo run -q --release -p voice-cli -- check --criteria A1,A4,B1,B3
