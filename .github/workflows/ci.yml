name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Tauri のアプリ（voice-tauri）は build のときに frontend/dist を取り込む
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - run: cargo build --workspace
      - run: cargo test --workspace
      - name: List audio devices
        run: cargo run -q -p voice-cli -- devices
      - name: Check acceptance criteria that already pass
        run: cargo run -q --release -p voice-cli -- check --criteria A1,A4,B3

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
