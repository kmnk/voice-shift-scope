name: release

# Windows の zip を作る。workflow_dispatch では artifact に上げるだけ、v で始まる tag では GitHub の release にも上げる。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-zip:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - run: cargo build --release -p voice-tauri -p voice-cli
      - name: Pack the zip
        shell: pwsh
        run: |
          $name = "voice-shift-scope-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory -Force "dist\$name\licenses" | Out-Null
          Copy-Item target\release\voice-shift-scope.exe "dist\$name\"
          Copy-Item target\release\voice-cli.exe "dist\$name\"
          Copy-Item third_party\signalsmith-stretch\LICENSE.txt "dist\$name\licenses\signalsmith-stretch.txt"
          Copy-Item third_party\signalsmith-linear\LICENSE.txt "dist\$name\licenses\signalsmith-linear.txt"
          Copy-Item docs\windows-checklist.md "dist\$name\" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist\$name" -DestinationPath "dist\$name.zip"
          "ZIP=dist\$name.zip" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: ${{ env.ZIP }}
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} ${{ env.ZIP }} --title ${{ github.ref_name }} --notes "Windows x64 の zip。VB-CABLE を別に入れてから使う。"
