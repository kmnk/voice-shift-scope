name: release

# Makes the Windows release packages (the app zip, the voice-cli zip, and SHA256SUMS.txt).
# A push of a tag starting with v makes a GitHub release. workflow_dispatch only keeps artifacts and makes no release.
# The jobs are build → sign → package → verify → publish. sign runs only when the repository variable SIGNPATH_ENABLED is true;
# otherwise unsigned exes are packaged. This file is the same in every phase; only the variables and the pushed tag change.
# SignPath's signing for OSS requires every job leading to the signing request to run on GitHub-hosted runners.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      unsigned-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      # For a tag, stop unless the tag matches the version in Cargo.toml and tauri.conf.json
      - id: version
        shell: pwsh
        run: |
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { '' }
          $version = python scripts/check_version.py $tag
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@stable
      # Builds the same thing as windows-ui.yml, so the cache is shared
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release-app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - run: cargo build --release --locked -p voice-tauri -p voice-cli
      # The crate sources exist only in this runner's cargo directory, so the dependency licenses are collected here
      - name: Collect third-party licenses
        run: python scripts/third_party_licenses.py --out THIRD-PARTY-LICENSES.txt
      - name: Stage the executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force unsigned | Out-Null
          Copy-Item target\release\voice-shift-scope.exe, target\release\voice-cli.exe unsigned\
      # The artifact handed to SignPath. It holds only the 2 exes (.signpath/artifact-configuration.xml)
      - id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: unsigned/
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES.txt

  sign:
    needs: build
    if: vars.SIGNPATH_ENABLED == 'true'
    runs-on: windows-latest
    steps:
      - uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.unsigned-artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - uses: actions/upload-artifact@v4
        with:
          name: signed-exe
          path: signed/

  package:
    needs: [build, sign]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.sign.result == 'success' && 'signed-exe' || 'unsigned-exe' }}
          path: exe
      - uses: actions/download-artifact@v4
        with:
          name: third-party-licenses
          path: licenses
      - name: Pack the zips
        shell: pwsh
        run: |
          $version = '${{ needs.build.outputs.version }}'
          $common = 'LICENSE-MIT', 'LICENSE-APACHE', 'licenses\THIRD-PARTY-LICENSES.txt'
          New-Item -ItemType Directory -Force release | Out-Null
          $contents = @{
            "voice-shift-scope-$version-windows-x64" = @('exe\voice-shift-scope.exe', 'packaging\README.txt') + $common
            "voice-cli-$version-windows-x64" = @('exe\voice-cli.exe') + $common
          }
          foreach ($name in $contents.Keys) {
            New-Item -ItemType Directory -Force "dist\$name" | Out-Null
            Copy-Item $contents[$name] "dist\$name\"
            Compress-Archive -Path "dist\$name" -DestinationPath "release\$name.zip"
          }
          # Write LF line endings so shasum -c can read it too
          $sums = Get-ChildItem release\*.zip | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          [IO.File]::WriteAllText("$PWD\release\SHA256SUMS.txt", ($sums -join "`n") + "`n")
          Get-Content release\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release/

  # On a fresh runner, unpack and start the release package as a user would (an environment without build leftovers)
  verify:
    needs: [build, sign, package]
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release
      - name: Check the checksums and the contents of the zips
        shell: pwsh
        run: |
          $version = '${{ needs.build.outputs.version }}'
          foreach ($line in Get-Content release\SHA256SUMS.txt) {
            $hash, $name = $line -split '  ', 2
            $actual = (Get-FileHash "release\$name" -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $hash) { Write-Error "SHA-256 mismatch: $name"; exit 1 }
            "SHA-256 OK: $name"
          }
          $expected = @{
            "voice-shift-scope-$version-windows-x64" = 'LICENSE-APACHE', 'LICENSE-MIT', 'README.txt', 'THIRD-PARTY-LICENSES.txt', 'voice-shift-scope.exe'
            "voice-cli-$version-windows-x64" = 'LICENSE-APACHE', 'LICENSE-MIT', 'THIRD-PARTY-LICENSES.txt', 'voice-cli.exe'
          }
          foreach ($name in $expected.Keys) {
            Expand-Archive "release\$name.zip" -DestinationPath unpacked
            $actual = (Get-ChildItem "unpacked\$name" -File | Sort-Object Name).Name -join ','
            $want = ($expected[$name] | Sort-Object) -join ','
            if ($actual -ne $want) { Write-Error "unexpected contents in $name.zip: $actual"; exit 1 }
            "contents OK: $name.zip ($actual)"
          }
      - name: Check the signatures
        if: vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          foreach ($exe in Get-ChildItem unpacked -Recurse -Filter *.exe) {
            $sig = Get-AuthenticodeSignature $exe.FullName
            "$($exe.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'SignPath Foundation') { exit 1 }
          }
      - name: Allow desktop apps to use the microphone
        shell: pwsh
        run: |
          foreach ($root in 'HKLM:', 'HKCU:') {
            $key = "$root\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone"
            New-Item -Path $key -Force | Out-Null
            Set-ItemProperty -Path $key -Name Value -Value Allow
            New-Item -Path "$key\NonPackaged" -Force | Out-Null
            Set-ItemProperty -Path "$key\NonPackaged" -Name Value -Value Allow
          }
      - name: Run the UI self-test with the unpacked app
        shell: pwsh
        timeout-minutes: 5
        run: |
          $version = '${{ needs.build.outputs.version }}'
          & "unpacked\voice-cli-$version-windows-x64\voice-cli.exe" synth vowel --f0 150 --seconds 60 --out vowel150.wav
          ./scripts/ui_selftest.ps1 ui-out -Exe "$PWD\unpacked\voice-shift-scope-$version-windows-x64\voice-shift-scope.exe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-unpacked
          path: ui-out

  publish:
    needs: [build, verify]
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release
      # Create it as a draft and publish after uploading the files. If the version starts with 0, mark it as a pre-release (development version)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          notes="packaging/release-notes/$TAG.md"
          test -f "$notes" || { echo "::error::$notes is missing"; exit 1; }
          pre=""
          case "$VERSION" in 0.*) pre="--prerelease" ;; esac
          gh release create "$TAG" --draft --title "$TAG" --notes-file "$notes" $pre --verify-tag
          gh release upload "$TAG" release/*
          gh release edit "$TAG" --draft=false
