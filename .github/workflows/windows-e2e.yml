name: windows-e2e

# Installs VB-CABLE on a Windows runner and checks the real WASAPI path.
# loopback checks only the VB-CABLE path without the shifter; e2e runs the audio runtime (voice-runtime) with a wav source.
# The runner is created fresh each time, so the user's devices and settings are not touched.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/voice-runtime/**"
      - "crates/voice-cli/**"
      - ".github/workflows/windows-e2e.yml"
      - "scripts/e2e_gate.ps1"

# When pushed again in a row, cancel the older run on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Check the behaviour without VB-CABLE first, then install VB-CABLE, building only once
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - id: build
        run: cargo build --release -p voice-cli
      - name: Synthesize a test vowel
        run: target/release/voice-cli synth vowel --f0 150 --seconds 2 --out vowel150.wav
      - name: Expect exit code 2 when VB-CABLE is missing
        shell: pwsh
        run: |
          target/release/voice-cli loopback --input-wav vowel150.wav
          if ($LASTEXITCODE -ne 2) { Write-Error "loopback: expected exit code 2, got $LASTEXITCODE"; exit 1 }
          target/release/voice-cli e2e --seconds 1
          if ($LASTEXITCODE -ne 2) { Write-Error "e2e: expected exit code 2, got $LASTEXITCODE"; exit 1 }
          exit 0
      - name: Install VB-CABLE
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf # v1.0.4
      - name: Allow desktop apps to use the microphone
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          foreach ($root in 'HKLM:', 'HKCU:') {
            $key = "$root\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone"
            New-Item -Path $key -Force | Out-Null
            Set-ItemProperty -Path $key -Name Value -Value Allow
            New-Item -Path "$key\NonPackaged" -Force | Out-Null
            Set-ItemProperty -Path "$key\NonPackaged" -Name Value -Value Allow
          }
          Get-Service audiosrv, AudioEndpointBuilder | Format-Table -AutoSize Name, Status
      - name: Loop it through VB-CABLE
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          target/release/voice-cli loopback --input-wav vowel150.wav --out-wav recorded.wav | Tee-Object -FilePath e2e-report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The e2e exit code includes A5 (latency) and A6 (dropouts). On runners A5 exceeds 150 ms and A6 gets underruns,
      # so here the values are only kept in the report, and the result is decided only by A1 and the analysis, which can be judged on a runner.
      - name: Measure latency through the audio runtime (0 semitones, 10 s)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          target/release/voice-cli e2e --seconds 10 --semitones 0 | Tee-Object -FilePath e2e-latency.json
          if ($LASTEXITCODE -eq 2) { Write-Error "VB-CABLE not found"; exit 1 }
          ./scripts/e2e_gate.ps1 e2e-latency.json A1 analysis
      - name: Run the audio runtime through VB-CABLE (+5 semitones, 20 s)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          target/release/voice-cli e2e --seconds 20 --semitones 5 | Tee-Object -FilePath e2e-runtime.json
          if ($LASTEXITCODE -eq 2) { Write-Error "VB-CABLE not found"; exit 1 }
          ./scripts/e2e_gate.ps1 e2e-runtime.json A1 analysis
      # Lowering the pitch below 0 semitones switches the shifter to TD-PSOLA (crates/voice-dsp/src/hybrid.rs).
      # Run that side through the audio runtime too
      - name: Run the audio runtime through VB-CABLE (-12 semitones, PSOLA, 20 s)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          target/release/voice-cli e2e --seconds 20 --semitones -12 | Tee-Object -FilePath e2e-runtime-lowered.json
          if ($LASTEXITCODE -eq 2) { Write-Error "VB-CABLE not found"; exit 1 }
          ./scripts/e2e_gate.ps1 e2e-runtime-lowered.json A1 analysis
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            e2e-report.json
            recorded.wav
            e2e-latency.json
            e2e-runtime.json
            e2e-runtime-lowered.json

