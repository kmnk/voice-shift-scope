name: windows-ui

# 画面の通しの試験。アプリを --ui-selftest で起動すると、画面の側がボタンを押す・値を入れる操作を順に行い、
# 画面に出たものを読んで判定し、ui-report.json を書いて終わる（終了コード 0 が成功）。
# tauri-driver（WebDriver）は、このランナーで「DevToolsActivePort file doesn't exist」でアプリにつながらなかったので使わない。
# 入力は --input-wav の試験用の母音、設定と画像の保存先はランナーの一時的な場所。ランナーは毎回作り直される。
# build を 1 回で済ませるため、1 つの job で VB-CABLE を入れる前と後に 1 回ずつ動かす。
# 自己試験は、その時点で VB-CABLE があるかを読んで、無ければ C4、あれば cable-found を判定する。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "crates/**"
      - ".github/workflows/windows-ui.yml"
      - "scripts/ui_selftest.ps1"

# 続けて push したときは、同じブランチの古い実行を止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # release.yml と同じものを build するので、cache を共有する
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release-app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - id: build
        run: cargo build --release -p voice-tauri -p voice-cli
      - name: Allow desktop apps to use the microphone
        shell: pwsh
        run: |
          foreach ($root in 'HKLM:', 'HKCU:') {
            $key = "$root\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone"
            New-Item -Path $key -Force | Out-Null
            Set-ItemProperty -Path $key -Name Value -Value Allow
            New-Item -Path "$key\NonPackaged" -Force | Out-Null
            Set-ItemProperty -Path "$key\NonPackaged" -Name Value -Value Allow
          }
      - run: target/release/voice-cli synth vowel --f0 150 --seconds 60 --out vowel150.wav
      - name: Run the UI self-test without VB-CABLE
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/ui_selftest.ps1 ui-out-without-vb-cable
      - name: Install VB-CABLE
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf # v1.0.4
      - name: Run the UI self-test with VB-CABLE
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/ui_selftest.ps1 ui-out-with-vb-cable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-without-vb-cable
          path: ui-out-without-vb-cable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-with-vb-cable
          path: ui-out-with-vb-cable
