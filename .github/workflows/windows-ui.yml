name: windows-ui

# End-to-end UI test. Started with --ui-selftest, the app's screen presses buttons and enters values in order,
# judges by reading what appears on screen, writes ui-report.json, and exits (exit code 0 is success).
# tauri-driver (WebDriver) is not used, because on this runner it could not connect to the app ("DevToolsActivePort file doesn't exist").
# The input is the test vowel through --input-wav; settings and saved images go to temporary places on the runner. The runner is created fresh each time.
# To build only once, one job runs the test once before and once after installing VB-CABLE.
# The self-test reads whether VB-CABLE is present at that point, and checks C4 if not and cable-found if so.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "crates/**"
      - ".github/workflows/windows-ui.yml"
      - "scripts/ui_selftest.ps1"

# When pushed again in a row, cancel the older run on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Builds the same thing as release.yml, so the cache is shared
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release-app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - id: build
        run: cargo build --release -p voice-tauri -p voice-cli
      - name: Allow desktop apps to use the microphone
        shell: pwsh
        run: |
          foreach ($root in 'HKLM:', 'HKCU:') {
            $key = "$root\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone"
            New-Item -Path $key -Force | Out-Null
            Set-ItemProperty -Path $key -Name Value -Value Allow
            New-Item -Path "$key\NonPackaged" -Force | Out-Null
            Set-ItemProperty -Path "$key\NonPackaged" -Name Value -Value Allow
          }
      - run: target/release/voice-cli synth vowel --f0 150 --seconds 60 --out vowel150.wav
      - name: Run the UI self-test without VB-CABLE
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/ui_selftest.ps1 ui-out-without-vb-cable
      - name: Install VB-CABLE
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf # v1.0.4
      - name: Run the UI self-test with VB-CABLE
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/ui_selftest.ps1 ui-out-with-vb-cable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-without-vb-cable
          path: ui-out-without-vb-cable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-with-vb-cable
          path: ui-out-with-vb-cable
