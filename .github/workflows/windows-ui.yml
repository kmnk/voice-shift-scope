name: windows-ui

# 画面の通しの試験。アプリを --ui-selftest で起動すると、画面の側がボタンを押す・値を入れる操作を順に行い、
# 画面に出たものを読んで判定し、ui-report.json を書いて終わる（終了コード 0 が成功）。
# tauri-driver（WebDriver）は、このランナーで「DevToolsActivePort file doesn't exist」でアプリにつながらなかったので使わない。
# 入力は --input-wav の試験用の母音、設定と画像の保存先はランナーの一時的な場所。ランナーは毎回作り直される。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "crates/**"
      - ".github/workflows/windows-ui.yml"

jobs:
  ui:
    strategy:
      fail-fast: false
      matrix:
        cable: [with-vb-cable, without-vb-cable]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - run: cargo build --release -p voice-tauri -p voice-cli
      - name: Install VB-CABLE
        if: matrix.cable == 'with-vb-cable'
        uses: LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf # v1.0.4
      - name: Allow desktop apps to use the microphone
        shell: pwsh
        run: |
          foreach ($root in 'HKLM:', 'HKCU:') {
            $key = "$root\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone"
            New-Item -Path $key -Force | Out-Null
            Set-ItemProperty -Path $key -Name Value -Value Allow
            New-Item -Path "$key\NonPackaged" -Force | Out-Null
            Set-ItemProperty -Path "$key\NonPackaged" -Name Value -Value Allow
          }
      - run: target/release/voice-cli synth vowel --f0 150 --seconds 60 --out vowel150.wav
      - name: Run the UI self-test
        shell: pwsh
        timeout-minutes: 5
        env:
          VOICE_SHIFT_SCOPE_CONFIG_DIR: ${{ github.workspace }}\ui-out\config
          VOICE_SHIFT_SCOPE_TEST_SAVE_DIR: ${{ github.workspace }}\ui-out\saved
        run: |
          New-Item -ItemType Directory -Force ui-out\saved, ui-out\config | Out-Null
          $p = Start-Process target\release\voice-shift-scope.exe -ArgumentList '--input-wav', 'vowel150.wav', '--ui-selftest', "$PWD\ui-out" -PassThru
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; Write-Error "self-test did not finish in 180 s"; exit 1 }
          Get-Content ui-out\ui-report.json
          exit $p.ExitCode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-${{ matrix.cable }}
          path: ui-out
