[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
voice-domain = { path = "crates/voice-domain" }
voice-app = { path = "crates/voice-app" }
voice-dsp = { path = "crates/voice-dsp" }
voice-runtime = { path = "crates/voice-runtime" }
voice-tauri = { path = "crates/voice-tauri" }
thiserror = "2"
