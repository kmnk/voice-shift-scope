[package]
name = "voice-tauri"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The Tauri app of voice-shift-scope (inbound adapter and assembly)"

[lib]
name = "voice_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "voice-shift-scope"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
voice-domain.workspace = true
voice-app.workspace = true
voice-dsp.workspace = true
voice-runtime.workspace = true
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"

# Takes window shots in the end-to-end UI test (src/shot.rs). Used only on Windows
[target.'cfg(windows)'.dependencies]
png = "0.18"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_WindowsAndMessaging"] }

[features]
# Load the screen from frontend/dist even with plain `cargo build` (otherwise it opens the development server at http://localhost:5173)
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
