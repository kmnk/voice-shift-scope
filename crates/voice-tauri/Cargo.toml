[package]
name = "voice-tauri"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "voice-shift-scope の Tauri のアプリ（入る側の adapter と組み立て）"

[lib]
name = "voice_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "voice-shift-scope"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
voice-domain.workspace = true
voice-app.workspace = true
voice-dsp.workspace = true
voice-runtime.workspace = true
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"

[features]
# `cargo build` だけで作っても、画面を frontend/dist から読むようにする（無いと開発用の http://localhost:5173 を開く）
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
