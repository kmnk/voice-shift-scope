<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>voice-shift-scope</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="controls">
      <section class="group">
        <label>入力 <select id="input"></select></label>
        <span id="cable" class="cable" data-testid="cable-status"></span>
        <button id="start" data-testid="start">開始</button>
        <button id="stop" data-testid="stop" disabled>停止</button>
      </section>
      <section class="group">
        <label>ピッチ <input id="pitch" type="range" min="-24" max="24" step="0.1" value="0" />
          <input id="pitch-num" type="number" min="-24" max="24" step="0.1" value="0" /> 半音</label>
        <label>フォルマント <input id="formant" type="range" min="0.5" max="2" step="0.01" value="1" />
          <input id="formant-num" type="number" min="0.5" max="2" step="0.01" value="1" /> 倍</label>
      </section>
      <section class="group">
        <label>上限 <input id="ceiling" type="number" min="3000" max="8000" step="100" value="5500" /> Hz</label>
        <label>倍音のしきい値 <input id="threshold" type="number" min="0" max="40" step="1" value="10" /> dB</label>
      </section>
      <section class="group">
        <label><input id="monitor-on" type="checkbox" /> モニター</label>
        <select id="monitor"></select>
        <label>音量 <input id="volume" type="range" min="0" max="1" step="0.01" value="1" /></label>
      </section>
      <section class="group">
        <button id="freeze-all" data-testid="freeze-all" title="Space">全体を止める</button>
        <button id="freeze-before" data-testid="freeze-before" title="1">前を止める</button>
        <button id="freeze-after" data-testid="freeze-after" title="2">後を止める</button>
        <button id="save" data-testid="save" disabled>画像を保存</button>
      </section>
      <p id="message" class="message" role="status"></p>
    </header>
    <main id="screen" class="screen">
      <div class="spectrograms">
        <figure class="panel">
          <figcaption>変える前 <span id="before-state" class="state"></span></figcaption>
          <canvas id="before-gram" width="560" height="320"></canvas>
        </figure>
        <figure class="panel">
          <figcaption>変えた後 <span id="after-state" class="state"></span></figcaption>
          <canvas id="after-gram" width="560" height="320"></canvas>
        </figure>
      </div>
      <div class="lower">
        <figure class="panel">
          <figcaption>今の瞬間のスペクトル（灰色が前、青が後）</figcaption>
          <canvas id="spectrum" width="560" height="240"></canvas>
        </figure>
        <figure class="panel table-panel">
          <figcaption>数値（直近 250 ms の中央値）</figcaption>
          <table id="numbers" data-testid="numbers"></table>
        </figure>
      </div>
    </main>
    <output id="test-stats" data-testid="test-stats" hidden></output>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
