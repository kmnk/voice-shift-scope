<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>voice-shift-scope</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <aside class="controls">
      <div class="row topbar">
        <button id="view-toggle" data-testid="view-toggle"></button>
        <button id="lang-toggle" data-testid="lang-toggle" data-i18n="lang.toggle" data-i18n-title="lang.toggle.title"></button>
      </div>
      <section class="group">
        <h2 data-i18n="sec.devices"></h2>
        <label><span class="field-label" data-i18n="input"></span> <select id="input"></select></label>
        <button id="run" class="run" data-testid="run" data-i18n="start"></button>
        <label><span class="field-label" data-i18n="output"></span> <select id="output" data-testid="output"></select></label>
        <div class="row">
          <button id="monitor-on" class="monitor-toggle" data-testid="monitor-on" data-i18n="monitor.on" aria-pressed="false"></button>
          <select id="monitor"></select>
        </div>
        <label><span class="field-label" data-i18n="volume"></span> <input id="volume" type="range" min="0" max="1" step="0.01" value="1" /></label>
        <div class="row" data-i18n-title="route.title">
          <span class="field-label" data-i18n="route.source"></span>
          <button id="route" class="route-toggle" data-testid="route" data-source="shifted" data-i18n="route.shifted"></button>
        </div>
        <p id="cable" class="cable" data-testid="cable-status"></p>
      </section>
      <section class="group">
        <h2 data-i18n="sec.pitch"></h2>
        <div class="row">
          <input id="pitch-num" type="number" min="-24" max="24" step="0.1" value="0" />
          <button class="reset" data-target="pitch" data-i18n="reset" data-i18n-title="reset.title.pitch"></button>
        </div>
        <input id="pitch" type="range" min="-24" max="24" step="0.1" value="0" />
        <div class="row steps">
          <button data-target="pitch" data-step="-1">−1</button>
          <button data-target="pitch" data-step="-0.1">−0.1</button>
          <button data-target="pitch" data-step="0.1">+0.1</button>
          <button data-target="pitch" data-step="1">+1</button>
        </div>
      </section>
      <section class="group">
        <h2 data-i18n="sec.formant"></h2>
        <div class="row">
          <input id="formant-num" type="number" min="0.5" max="2" step="0.01" value="1" />
          <button class="reset" data-target="formant" data-i18n="reset" data-i18n-title="reset.title.formant"></button>
        </div>
        <input id="formant" type="range" min="0.5" max="2" step="0.01" value="1" />
        <div class="row steps">
          <button data-target="formant" data-step="-0.05">−0.05</button>
          <button data-target="formant" data-step="-0.01">−0.01</button>
          <button data-target="formant" data-step="0.01">+0.01</button>
          <button data-target="formant" data-step="0.05">+0.05</button>
        </div>
      </section>
      <section class="group full-only">
        <h2 data-i18n="sec.hold"></h2>
        <div class="row">
          <button id="freeze-all" data-testid="freeze-all" data-i18n-title="hold.title.all"></button>
        </div>
        <div class="row">
          <button id="freeze-before" data-testid="freeze-before" data-i18n-title="hold.title.original"></button>
          <button id="freeze-after" data-testid="freeze-after" data-i18n-title="hold.title.shifted"></button>
        </div>
        <button id="save" data-testid="save" data-i18n="snapshot" data-i18n-title="snapshot.title" disabled></button>
      </section>
      <section class="group full-only">
        <h2 data-i18n="sec.analysis"></h2>
        <label><span data-i18n="ceiling"></span> <input id="ceiling" type="number" min="3000" max="8000" step="100" value="5500" /></label>
        <p id="ceiling-note" class="note"></p>
        <label data-i18n-title="harm.floor.title"><span data-i18n="harm.floor"></span> <input id="threshold" type="number" min="0" max="40" step="1" value="10" /></label>
        <label data-i18n-title="harm.range.title"><span data-i18n="harm.range"></span> <input id="relative-limit" type="number" min="10" max="100" step="5" value="40" /></label>
      </section>
      <p id="message" class="message" role="status"></p>
    </aside>
    <main id="screen" class="screen full-only">
      <figure class="panel gram-before">
        <figcaption><span data-i18n="original"></span> <span id="before-state" class="state"></span></figcaption>
        <div class="canvas-box"><canvas id="before-gram"></canvas></div>
      </figure>
      <figure class="panel gram-after">
        <figcaption><span data-i18n="shifted"></span> <span id="after-state" class="state"></span></figcaption>
        <div class="canvas-box"><canvas id="after-gram"></canvas></div>
      </figure>
      <figure class="panel spectrum-panel">
        <figcaption data-i18n="panel.spectrum"></figcaption>
        <div class="canvas-box"><canvas id="spectrum"></canvas></div>
      </figure>
      <figure class="panel table-panel">
        <figcaption><span data-i18n="panel.values"></span> <span id="times-differ" class="differs" data-testid="times-differ"></span></figcaption>
        <div class="table-box"><table id="numbers" data-testid="numbers"></table></div>
      </figure>
    </main>
    <output id="test-stats" data-testid="test-stats" hidden></output>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
