<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>voice-shift-scope</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- 上の帯: 図を見ながら使う操作（開始・停止、止める、保存）と状態の知らせ、右端に設定・キー操作・言葉・表示の切り替え -->
    <header class="bar">
      <button id="run" class="run" data-testid="run"></button>
      <div class="hold-group full-only">
        <span class="hold-name" data-i18n="hold.row.all"></span>
        <button id="freeze-all" class="hold-switch" data-testid="freeze-all" aria-pressed="false" data-i18n-title="hold.title.all" data-i18n-aria="hold.aria.all"><span class="seg live" data-i18n="hold.live"></span><span class="seg hold" data-i18n="hold.hold"></span></button>
        <span class="key" aria-hidden="true">0</span>
      </div>
      <div class="hold-group full-only">
        <span class="hold-name" data-i18n="original"></span>
        <button id="freeze-before" class="hold-switch" data-testid="freeze-before" aria-pressed="false" data-i18n-title="hold.title.original" data-i18n-aria="hold.aria.original"><span class="seg live" data-i18n="hold.live"></span><span class="seg hold" data-i18n="hold.hold"></span></button>
        <span class="key" aria-hidden="true">1</span>
      </div>
      <div class="hold-group full-only">
        <span class="hold-name" data-i18n="shifted"></span>
        <button id="freeze-after" class="hold-switch" data-testid="freeze-after" aria-pressed="false" data-i18n-title="hold.title.shifted" data-i18n-aria="hold.aria.shifted"><span class="seg live" data-i18n="hold.live"></span><span class="seg hold" data-i18n="hold.hold"></span></button>
        <span class="key" aria-hidden="true">2</span>
      </div>
      <button id="save" class="save full-only" data-testid="save" data-icon="snapshot" data-i18n-title="snapshot.title" disabled><span class="label" data-i18n="snapshot"></span><span class="key" aria-hidden="true">S</span></button>
      <p id="message" class="message" role="status"></p>
      <div class="bar-end">
        <button id="settings-open" class="icon-button full-only" data-testid="settings-open" data-icon="settings" aria-expanded="false" aria-controls="settings" data-i18n-title="settings" data-i18n-aria="settings"></button>
        <button id="shortcuts-open" class="icon-button full-only" data-testid="shortcuts-open" data-icon="help" data-i18n-title="shortcuts.open" data-i18n-aria="shortcuts.open"></button>
        <button id="lang-toggle" data-testid="lang-toggle" data-i18n="lang.toggle" data-i18n-title="lang.toggle.title"></button>
        <button id="view-toggle" class="icon-button" data-testid="view-toggle"></button>
      </div>
    </header>
    <aside class="controls">
      <section class="group">
        <h2 data-i18n="sec.pitch"></h2>
        <div class="row value-row">
          <button class="step" data-target="pitch" data-dir="-1" data-testid="pitch-down" data-i18n-title="step.pitch.down" data-i18n-aria="step.pitch.down">−</button>
          <input id="pitch-num" class="value" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="0.0" data-value="0" data-i18n-aria="value.pitch" />
          <button class="step" data-target="pitch" data-dir="1" data-testid="pitch-up" data-i18n-title="step.pitch.up" data-i18n-aria="step.pitch.up">+</button>
          <button class="reset" data-target="pitch" data-icon="reset" data-i18n-title="reset.title.pitch" data-i18n-aria="reset.title.pitch"></button>
        </div>
        <div class="slider"><input id="pitch" type="range" min="-24" max="24" step="0.1" value="0" /><span class="tick" aria-hidden="true"></span></div>
      </section>
      <section class="group">
        <h2 data-i18n="sec.formant"></h2>
        <div class="row value-row">
          <button class="step" data-target="formant" data-dir="-1" data-testid="formant-down" data-i18n-title="step.formant.down" data-i18n-aria="step.formant.down">−</button>
          <input id="formant-num" class="value" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="1.00" data-value="1" data-i18n-aria="value.formant" />
          <button class="step" data-target="formant" data-dir="1" data-testid="formant-up" data-i18n-title="step.formant.up" data-i18n-aria="step.formant.up">+</button>
          <button class="reset" data-target="formant" data-icon="reset" data-i18n-title="reset.title.formant" data-i18n-aria="reset.title.formant"></button>
        </div>
        <div class="slider"><input id="formant" type="range" min="-1" max="1" step="0.001" value="0" /><span class="tick" aria-hidden="true"></span></div>
      </section>
      <section class="group">
        <h2 data-i18n="sec.devices"></h2>
        <label><span class="field-label" data-i18n="input"></span> <select id="input"></select></label>
        <label><span class="field-label" data-i18n="output"></span> <select id="output" data-testid="output"></select></label>
        <div class="row">
          <button id="monitor-on" class="monitor-toggle" data-testid="monitor-on" data-icon="monitor" aria-pressed="false"><span class="label" data-i18n="monitor.on"></span></button>
          <select id="monitor"></select>
        </div>
        <label><span class="field-label" data-i18n="volume"></span> <input id="volume" type="range" min="0" max="1" step="0.01" value="1" /></label>
        <div class="row" data-i18n-title="route.title">
          <span class="field-label" data-i18n="route.source"></span>
          <button id="route" class="route-toggle" data-testid="route" data-source="shifted"></button>
        </div>
        <!-- VB-CABLE の有無は画面に出さない（いつも使う前提にしない）。試験が有無を知るための data-found だけを持つ -->
        <p id="cable" class="cable" data-testid="cable-status" hidden></p>
      </section>
    </aside>
    <!-- 設定の板（分析の設定）。帯の設定のボタンで開き、Esc・板の外・ボタンで閉じる（main.ts） -->
    <div id="settings" class="settings" popover="manual" data-testid="settings">
        <section class="group">
          <h2 data-i18n="sec.analysis"></h2>
          <label><span data-i18n="ceiling"></span> <input id="ceiling" type="number" min="3000" max="8000" step="100" value="5500" /></label>
          <p id="ceiling-note" class="note"></p>
          <label data-i18n-title="harm.floor.title"><span data-i18n="harm.floor"></span> <input id="threshold" type="number" min="0" max="40" step="1" value="10" /></label>
          <label data-i18n-title="harm.range.title"><span data-i18n="harm.range"></span> <input id="relative-limit" type="number" min="10" max="100" step="5" value="40" /></label>
        </section>
    </div>
    <main id="screen" class="screen full-only">
      <figure class="panel gram-before" id="before-panel" data-held="false">
        <figcaption><span class="caption-title" data-i18n="original"></span><span id="before-state" class="state"></span><span class="legend"><span><i class="swatch" style="background: var(--formant-1)"></i>F1</span><span><i class="swatch" style="background: var(--formant-2)"></i>F2</span><span><i class="swatch" style="background: var(--formant-3)"></i>F3</span><span><i class="swatch" style="background: var(--formant-4)"></i>F4</span></span></figcaption>
        <div class="canvas-box"><canvas id="before-gram"></canvas><canvas id="before-cursor" class="overlay"></canvas><p id="plot-guide" class="plot-guide" role="status" data-testid="plot-guide"></p></div>
      </figure>
      <figure class="panel gram-after" id="after-panel" data-held="false">
        <figcaption><span class="caption-title" data-i18n="shifted"></span><span id="after-state" class="state"></span><span class="legend"><span><i class="swatch" style="background: var(--formant-1)"></i>F1</span><span><i class="swatch" style="background: var(--formant-2)"></i>F2</span><span><i class="swatch" style="background: var(--formant-3)"></i>F3</span><span><i class="swatch" style="background: var(--formant-4)"></i>F4</span></span></figcaption>
        <div class="canvas-box"><canvas id="after-gram"></canvas><canvas id="after-cursor" class="overlay"></canvas></div>
      </figure>
      <div class="lower">
      <figure class="panel spectrum-panel">
        <figcaption><span class="caption-title" data-i18n="panel.spectrum"></span><span class="legend line-legend" data-testid="spectrum-legend"><span><svg class="line-sample" width="16" height="8" aria-hidden="true"><line x1="0" y1="4" x2="16" y2="4" style="stroke: var(--before)" stroke-width="1" stroke-dasharray="4 2" /></svg><span data-i18n="original"></span></span><span><svg class="line-sample" width="16" height="8" aria-hidden="true"><line x1="0" y1="4" x2="16" y2="4" style="stroke: var(--accent)" stroke-width="1.5" /></svg><span data-i18n="shifted"></span></span></span></figcaption>
        <div class="canvas-box"><canvas id="spectrum"></canvas><canvas id="spectrum-cursor" class="overlay"></canvas></div>
      </figure>
      <figure class="panel table-panel">
        <figcaption><span class="caption-title" data-i18n="panel.values"></span><span id="times-differ" class="differs" data-testid="times-differ"></span></figcaption>
        <div class="table-box"><table id="numbers" data-testid="numbers"></table></div>
      </figure>
      </div>
    </main>
    <dialog id="shortcuts" class="shortcuts" data-testid="shortcuts" aria-labelledby="shortcuts-title">
      <div class="shortcuts-head">
        <h2 id="shortcuts-title" data-i18n="shortcuts.title"></h2>
        <button id="shortcuts-close" data-testid="shortcuts-close" data-icon="close" data-i18n-aria="close" data-i18n-title="close"></button>
      </div>
      <table>
        <tr><td><kbd>0</kbd><span class="or" data-i18n="shortcuts.or"></span><kbd>Space</kbd></td><td data-i18n="shortcuts.all"></td></tr>
        <tr><td><kbd>1</kbd></td><td data-i18n="shortcuts.original"></td></tr>
        <tr><td><kbd>2</kbd></td><td data-i18n="shortcuts.shifted"></td></tr>
        <tr><td><kbd>S</kbd></td><td data-i18n="shortcuts.save"></td></tr>
        <tr><td><kbd>↑</kbd><kbd>↓</kbd></td><td data-i18n="shortcuts.pitch.fine"></td></tr>
        <tr><td><kbd>Shift</kbd>+ <kbd>↑</kbd><kbd>↓</kbd></td><td data-i18n="shortcuts.pitch.coarse"></td></tr>
        <tr><td><kbd>→</kbd><kbd>←</kbd></td><td data-i18n="shortcuts.formant.fine"></td></tr>
        <tr><td><kbd>Shift</kbd>+ <kbd>→</kbd><kbd>←</kbd></td><td data-i18n="shortcuts.formant.coarse"></td></tr>
        <tr><td><kbd>?</kbd></td><td data-i18n="shortcuts.help"></td></tr>
      </table>
      <p data-i18n="shortcuts.note"></p>
    </dialog>
    <output id="test-stats" data-testid="test-stats" hidden></output>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
